# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
# Render injects its own PORT env var at runtime; ${PORT:9090} falls back
# to 9090 for local development if PORT isn't set.
server.port=${PORT:9090}

# ---------------------------------------------------------------------
# Database — Supabase Postgres
# ---------------------------------------------------------------------
# Get these three from Supabase -> Project Settings -> Database ->
# Connection string (use the "Transaction" pooler connection on port 6543
# for Render, since Render's free/starter tier works better with pooled
# connections than a direct connection on port 5432).
#
# Example DB_URL:
#   jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------
# validate (not update/create) — Flyway owns the schema, Hibernate should
# only confirm the Appraisal entity matches what Flyway already created,
# never auto-modify the table itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing,*:future

# ---------------------------------------------------------------------
# Mail (SMTP) — for emailing the generated PDF
# ---------------------------------------------------------------------
# These work with Gmail SMTP, SendGrid SMTP, or any other SMTP provider.
# For Gmail specifically, MAIL_PASSWORD must be an App Password, not your
# normal account password (Google blocks plain-password SMTP logins).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# App-specific config — read in code via @Value
# ---------------------------------------------------------------------
app.server-api-key=${SERVER_API_KEY:}
app.allowed-origin=${ALLOWED_ORIGIN:*}
app.from-email=${FROM_EMAIL}
app.company-name=UXINTERFACELY IT SOLUTIONS LLP
app.company-hq-city=Hyderabad

# ---------------------------------------------------------------------
# Swagger / OpenAPI UI
# ---------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui/index.html

# Allow the letter PDF to be uploaded for emailing (default limit is 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
